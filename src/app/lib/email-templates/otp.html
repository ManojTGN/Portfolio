<!DOCTYPE html>
<!--
  OTP verification email — localized via public/locales/{lang}.json.
  Placeholders ({{var}} = HTML-escaped, {{{var}}} = raw) substituted by src/app/lib/email.js.
  Available vars: title, preheader, senderName, senderTagline, heading, intro, disclaimer, signoff, footer, code
  Open this file directly in a browser to preview design — placeholders render as literal text.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<title>{{title}}</title>
</head>
<body style="margin:0; padding:0; background:#f4f4f4; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased;">
<div style="display:none; max-height:0; overflow:hidden; mso-hide:all; visibility:hidden; opacity:0; color:transparent;">{{preheader}}</div>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#f4f4f4; padding:32px 16px;">
  <tr>
    <td align="center">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="560" style="max-width:560px; width:100%; background:#ffffff; border:1px solid #c1c1c1;">
        <tr>
          <td style="padding:28px 32px 12px 32px;">
            <p style="margin:0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Helvetica, Arial, sans-serif; font-size:11px; letter-spacing:0.24em; color:#6a6a6a; text-transform:uppercase;">{{senderName}} &nbsp;&middot;&nbsp; {{senderTagline}}</p>
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%"><tr><td style="border-top:2px dashed #030303; font-size:0; line-height:0; height:2px;">&nbsp;</td></tr></table>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 32px 6px 32px;">
            <h1 style="margin:0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Helvetica, Arial, sans-serif; font-size:22px; font-weight:600; color:#030303; letter-spacing:-0.01em;">{{heading}}</h1>
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px 20px 32px;">
            <p style="margin:0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Helvetica, Arial, sans-serif; font-size:15px; line-height:1.6; color:#373737;">{{intro}}</p>
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
              <tr>
                <td align="center" style="border:2px solid #030303; padding:22px 16px; background:#ffffff;">
                  <p style="margin:0; font-family:'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; font-size:34px; line-height:1; letter-spacing:0.4em; font-weight:700; color:#030303;">{{code}}</p>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 32px 4px 32px;">
            <p style="margin:0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Helvetica, Arial, sans-serif; font-size:13px; line-height:1.6; color:#6a6a6a;">{{disclaimer}}</p>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 32px 28px 32px;">
            <p style="margin:0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Helvetica, Arial, sans-serif; font-size:14px; color:#373737;">{{signoff}}</p>
          </td>
        </tr>
      </table>
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="560" style="max-width:560px; width:100%;">
        <tr>
          <td style="padding:14px 32px; text-align:center;">
            <p style="margin:0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Helvetica, Arial, sans-serif; font-size:11px; color:#868686;">{{footer}}</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
